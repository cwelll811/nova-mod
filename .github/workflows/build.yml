name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nova-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: nova-jar
          path: nova-mod/build/libs/nova-1.0.0.jar
